# https://contributors.home-assistant.io/apps/reference/configuration/
name: Kit SOS
version: "1.0.0"
slug: kit_sos
description: Simple, clean tracker for emergency-kit items, quantities and expiry dates, with alerts before things expire.
url: "https://github.com/diogopires21-alt/ha-kit-sos/tree/main/kit_sos"
arch:
  - aarch64
  - amd64
init: false
ingress: true
panel_icon: mdi:medical-bag
panel_title: Kit SOS
homeassistant_api: true
# Junta as últimas alterações ao ficheiro principal antes da cópia de segurança
backup_pre: "python3 -c \"import sqlite3; sqlite3.connect('/data/kit_sos.db').execute('PRAGMA wal_checkpoint(TRUNCATE)')\""
backup_exclude:
  - "*.db-shm"
options:
  language: auto
  notify_enabled: true
  notify_days: 30
  notify_time: "10:00"
  notify_service: telegram_bot.send_message
  notify_target: ""
  sensors: true
schema:
  language: list(auto|pt|en)
  notify_enabled: bool
  notify_days: int(0,365)
  notify_time: 'match(^([01]\d|2[0-3]):[0-5]\d$)'
  notify_service: 'match(^[a-z0-9_]+\.[a-z0-9_]+$)'
  notify_target: str?
  sensors: bool
# Imagem já compilada pelo GitHub Actions (quem instala não precisa de compilar).
# Para usar como app local (pasta /addons), apaga esta linha.
image: "ghcr.io/diogopires21-alt/kit-sos"
